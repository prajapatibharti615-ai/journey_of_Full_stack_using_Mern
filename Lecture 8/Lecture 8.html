<!-- HTML Form : Structure of HTML Form- To collect user input 
 Tags: 
    <form> : Container for form elements
    <input> : Various types of input fields (text, password, checkbox, radio, etc.)
    <label> : Label for form elements, Create label for input fields for attibute = for="id of input field"
    
    input type=" "
    type='text' : To create text input field
    type='radio' : To create radio button
    type='checkbox' : To create checkbox    
    type='date' : To create date input field
    id=" " : To uniquely identify an element, used for label association and scripting
    name=" " : To group related form elements, especially for radio buttons and checkboxes

    select - dropdown list
    button - clickable button, can be used for form submission or other actions
    textarea - multi-line text input field
    fieldset - group related elements in a form, often used with legend to provide a caption for the group
    legend - provides a caption for a fieldset, used to describe the purpose of the grouped elements

-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <br>
