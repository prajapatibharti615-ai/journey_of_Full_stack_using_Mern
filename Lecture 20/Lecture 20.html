<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<style>
    .container {
        background-color: beige;
        border: 1px solid black;
        margin: 2px;
        padding: 2px;

        display: flex;
        flex-direction: row;
        /* By default Display propert flex is row */
        flex-wrap: wrap;
        /* flex-wrap: nowrap; */
        /* flex-wrap: wrap-reverse; */
        height: 1200px;
        justify-content: center;
        /*horizontallly center */
        /* justify-content: space-between; */
        /* align-items: center; */
        /* align-items: start; */
        /* align-items: stretch; */
        align-items: center;
        align-content: start;



    }

    .container1 {
        background-color: beige;
        border: 1px solid black;
        margin: 2px;
        padding: 2px;
        display: flex;
        /* By default Display propert flex is row */
        /* flex-direction: row; */
        /* flex-direction: row-reverse; */
        flex-direction: row-reverse;
        /* flex-wrap: wrap; */
        /* flex-wrap: nowrap; */
        /* flex-wrap: wrap-reverse; */
        justify-content: end;
        justify-content: space-evenly;


    }


    .box {
        height: 200px;
        width: 200px;
        border: 2px solid brown;
        margin: 2px;
        padding: 2px;
    }

    #box1 {
        background-color: aqua;
    }

    #box2 {
        background-color: blue;
    }

    #box3 {
        background-color: orange;
    }

    #box4 {
        background-color: brown;
    }

    .image {
        background-color: bisque;
        border: 2px solid black;
        margin: 2px;
        padding: 2px;
        display: flex;
        /* flex-direction: column-reverse; */
        flex-direction: row-reverse;
        /* flex-wrap: wrap; */
        /* flex-wrap: nowrap; */
        justify-content: start;
        justify-content: space-around;



    }

    .img {
        height: 200px;
        width: 200px;
    }
</style>

<body>
    <h1>Day 20 Full stack of Web Development Using MERN</h1>
    <h1>CSS Flexbox </h1>
    <h1>Display Flex</h1>
    <div class="container">

    <div class="container1">
