<!-- 
 Favicon, Title, Meta Tags, CSS Links, JS Links, Fonts Links, etc.
Inside <Head>: 
    SEO: 
    Favicon : A href image add     <link rel="shortcut icon" href="logo.png" type="image/x-icon">
 How to link css file into html file:
    <link rel="stylesheet" href="style.css">

How to link Java file into html file:
    <script src="script.js"></script>

SEO: Search Engine Optimization
    - Meta Tags: <meta name="description" content="This is a description of the webpage.">
    - Title Tag: <title>Title of the webpage</title>



-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favicon,Meta, Title</title>
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <h1> Welcome to CodeHelp</h1>
    <button>Submit</button>
</body>

</html>
