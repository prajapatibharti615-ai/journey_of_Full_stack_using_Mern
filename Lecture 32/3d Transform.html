<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture 32 3D Transform CSS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;

        }

        .my_container {
            background-color: rgb(211, 159, 81);
            text-align: center;
            color: rgb(129, 17, 17);
            /* margin: 4rem;
            padding: 4rem; */
            width: 100%;
            height: 100%;
            padding: 5rem;
            /* overflow: hidden; */
        }

        .my_container:hover {
            transform: rotateX(45deg);
        }

        .container {
            background-color: antiquewhite;
            padding: 5rem;
            /* display: flex; */
            /* flex-direction: row-reverse; */
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            justify-content: center;
            justify-items: center;
        }

        .item {
            height: 250px;
            width: 250px;
            background-color: rgb(192, 59, 204);
            border: 2px solid black;
        }

        #rotateX:hover {
            transform: rotateX(45deg);
        }

        #rotateY:hover {
            transform: rotateY(45deg);
            /* transform: rotateY(-45deg); */
        }

        #rotateZ:hover {
            transform: rotateZ(45deg);

        }

        #translateX:hover {
            transform: translateX(100px);
            /* transform: translateX(-100px); */

        }

        #translateY:hover {
            /* transform: translateY(100px); */
            transform: translateY(-100px);
        }

        #translateZ:hover {
            /* transform: perspective(300px) translateZ(100px); */
            transform: perspective(300px) translateZ(-100px);

        }

        #scaleX:hover {
            transform: scaleX(1.5);
        }

        #scaleY:hover {
            transform: scaleY(1.5);
            /* transform: skewY(30deg); */
        }

        #scaleZ:hover {
            transform: perspective(300px) scaleZ(5)rotateY(10deg);
        }

        #skewX:hover {
            transform: skewX(45deg);
        }

        #skewY:hover {
            transform: skewY(30deg);
        }

        #skewZ:hover {
            transform: skew(35deg);
        }
    </style>
</head>

<body>
    <div class="my_container">
        <h1>CSS 3D Transform</h1>
    </div>
    <div class="container">
        <div class="item" id="rotateX">RotateX</div>
        <div class="item" id="rotateY">RotateY</div>
        <div class="item" id="rotateZ">RotateZ</div>
        <div class="item" id="translateX">TranslateX</div>
        <div class="item" id="translateY">TranslateY</div>
        <div class="item" id="translateZ">TranslateZ</div>
        <div class="item" id="scaleX">ScaleX</div>
        <div class="item" id="scaleY">ScaleY</div>
        <div class="item" id="scaleZ">ScaleZ</div>
        <div class="item" id="skewX">SkewX</div>
        <div class="item" id="skewY">SkewY</div>
        <div class="item" id="skewZ">SkewZ</div>



    </div>

</body>

</html>
