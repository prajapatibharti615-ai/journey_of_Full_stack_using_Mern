<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Second</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            width: 100vw;
            height: 100vh;
            /* background: #faf5f5;
            background: radial-gradient(circle, rgba(250, 245, 245, 1) 0%, rgba(220, 225, 230, 1) 100%); */
            background: #833AB4;
            background: linear-gradient(90deg, rgba(131, 58, 180, 1) 22%, rgba(227, 197, 197, 1) 50%, rgba(199, 46, 230, 1) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 400px;
            height: 600px;
            background-color: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            /* padding: 20px; */


        }

        .card img {
            width: 100%;
            height: 30%;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;

        }

        .textBox {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            /* padding: 20px; */
            width: 75%;
            text-align: center;
        }

        #amountBox {
            width: 80%;
            height: 10%;
            background-color: #8BC6EC;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            padding-left: 20px;
        }

        .leftBox {
            /* width: fit-content; */
            height: 100%;
            display: flex;
            gap: 15px;
            align-items: center;

        }

        /* .rightBox {} */

        .imageBox img {
            height: 3.5rem;
            width: 3.5rem;
        }

        #paymentButton {
            width: 80%;
            height: 9%;
            background-color: rgb(15, 15, 70);
            color: white;
            border-radius: 9px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.19), 0 6px 6px rgba(0, 0, 0, 0.23);

        }


        .cancelBox a {
            text-decoration: none;
            color: rgb(46, 43, 43);
            font-weight: bold;
            font-size: large;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <img src="images/icon.jpg" />

            <div class="textBox">
                <h2>Order Summary</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Cumque assumenda ipsa obcaecati rerum
                    distinctio
                    eius non repudiandae quasi. Fugit, aliquid.</p>

            </div>

            <div id="amountBox">
                <div class="leftBox">
                    <div class="imageBox">
                        <img src="images/music2.png" />
                    </div>
                    <div id="textAmount">
                        <p>Amount</p>
                        <p>$99.9/Year</p>
                    </div>

                </div>
                <div class="rightBox">
                    <a href="#">Change</a>
                </div>

            </div>
            <button id="paymentButton">Proceed to Payment


            </button>
            <div class="cancelBox">
                <a href="#">Cancel Order</a>
            </div>




        </div>

</body>

</html>
