<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        /* Card First CSS */

        .container {
            /* width: 100%;
            height: 100%; */
            width: 100vw;
            height: 100vh;
            /* min-height: 1300px; */
            background-color: #8BC6EC;
            background-image: linear-gradient(135deg, #8BC6EC 0%, #9599E2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 360px;
            height: 570px;
            background-color: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 20px;
        }

        .card img {
            height: 57%;
            border-radius: 10px;



        }

        .card h2 {
            font-weight: bold;
            font-size: 1.5rem;
        }

        .card p {
            font-size: 1.2em;
        }

        /* End Card First */
    </style>
</head>

<body>
    <!-- Card First -->
    <div class="container">
        <div class="card">
            <img src="images/qrcode.jpg" />
            <h2>Improve your front end skills buy developing Projects</h2>
            <p>
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Ad fugiat voluptas esse, repellat ipsam
                officiis porro tenetur ratione!
            </p>

        </div>

    </div>

</body>

</html>
