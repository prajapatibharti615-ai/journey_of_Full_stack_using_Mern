<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Third Card for Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            height: 100vh;
            width: 100vw;
            background: #EEAECA;
            background: radial-gradient(circle, rgba(238, 174, 202, 1) 0%, rgba(148, 187, 233, 1) 100%);
            justify-content: center;
            display: flex;
            /* flex-direction: row; */
            align-items: center;

        }

        .card {
            width: 640px;
            height: 400px;
            background-color: white;
            border-radius: 20px;

            display: flex;
            flex-direction: row;
            /* Vertical Layout */

            align-items: center;
            justify-content: space-evenly;
        }

        .leftBox {
            width: 100%;
            height: 100%;
            background-color: lightblue;
            /* border-radius: 15px; */
            padding: 0;
            display: flex;
            flex-direction: column;

        }

        .rightBox {
            width: 100%;
            height: 100%;
            /* background-color: lightpink; */
            /* border-radius: 15px; */
        }

        .rightBox img {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="leftBox">
                <h2>Get Insights that help your business grow</h2>
                <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Enim quisquam suscipit corrupti ipsa atque
                    minus ipsum sunt modi tenetur, odio esse at excepturi dolores assumenda animi? Itaque aliquam sequi
                    quaerat.</p>
                <div class="static">

                </div>

            </div>
            <div class="rightBox">
                <img src="images/icon.jpg" />

            </div>
        </div>
    </div>

</body>

</html>
